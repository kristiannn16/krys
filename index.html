<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Ultra</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: black;
  overflow: hidden;
  color: white;
}

/* LOADER */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #1a001f, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.8s;
}

.loader-content {
  text-align: center;
  cursor: pointer;
}

.loader-content h1 {
  font-size: 50px;
  text-shadow: 0 0 20px #b266ff, 0 0 40px #b266ff;
}

/* BACKGROUND (unchanged) */
.nebula {
  position: fixed;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 30% 30%, #6a00ff33, transparent),
    radial-gradient(circle at 70% 70%, #b266ff22, transparent),
    radial-gradient(circle at 50% 50%, #ff00ff11, transparent);
  animation: nebulaMove 25s linear infinite;
  z-index: -5;
}

@keyframes nebulaMove {
  0% { transform: translate(0,0); }
  50% { transform: translate(-5%, -5%); }
  100% { transform: translate(0,0); }
}

.stars, .stars2, .stars3 {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -4;
}

.stars::before, .stars2::before, .stars3::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 2px;
  background: #b266ff;
  box-shadow:
    5vw 10vh #b266ff, 10vw 30vh #b266ff, 15vw 80vh #b266ff,
    20vw 50vh #b266ff, 25vw 20vh #b266ff, 30vw 70vh #b266ff,
    35vw 40vh #b266ff, 40vw 90vh #b266ff, 45vw 10vh #b266ff,
    50vw 60vh #b266ff, 55vw 30vh #b266ff, 60vw 85vh #b266ff,
    65vw 25vh #b266ff, 70vw 55vh #b266ff, 75vw 15vh #b266ff,
    80vw 75vh #b266ff, 85vw 35vh #b266ff, 90vw 95vh #b266ff,
    95vw 45vh #b266ff;
}

.stars { animation: move 30s linear infinite; }
.stars2 { animation: move 60s linear infinite; opacity: 0.6; }
.stars3 { animation: move 90s linear infinite; opacity: 0.3; }

@keyframes move {
  from { transform: translateY(0); }
  to { transform: translateY(-100vh); }
}

.layer {
  position: fixed;
  width: 120%;
  height: 120%;
  backdrop-filter: blur(60px);
  z-index: -3;
  opacity: 0.2;
}

/* CONTAINER */
.container {
  max-width: 400px;
  margin: 80px auto 0;
  padding: 20px;
  transition: transform 0.1s;
}

/* PROFILE & CARD (unchanged) */
.profile { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
.profile img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #b266ff; box-shadow: 0 0 20px #b266ff; }
.glow-text { font-size: 40px; text-shadow: 0 0 10px #fff, 0 0 20px #b266ff; }

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(178,102,255,0.3);
  margin-bottom: 20px;
  padding: 10px;
}
.card img { width: 100%; border-radius: 15px; }

/* PLAYER - Restored to original look */
.player {
  display: flex;
  align-items: center;
  padding: 12px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
  margin-bottom: 15px;
}

.player img {
  width: 50px;
  border-radius: 10px;
  transition: all 0.05s ease;
}

.player-info {
  flex: 1;
  margin-left: 12px;
}

.song-title {
  font-size: 13px;
  font-weight: 500;
  opacity: 0.9;
}

/* Progress Bar - Original Style */
.progress-wrap {
  position: relative;
  width: 100%;
  height: 18px;
  display: flex;
  align-items: center;
}

.progress-track {
  position: absolute;
  width: 100%;
  height: 3px;
  border-radius: 10px;
  background: rgba(255,255,255,0.15);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 10px;
  background: rgba(220, 220, 220, 0.85);
  box-shadow:
    0 0 6px rgba(255,255,255,0.9),
    0 0 14px rgba(255,255,255,0.6),
    0 0 28px rgba(200,180,255,0.4);
  transition: width 0.1s linear;
}

.progress-range {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  z-index: 2;
}

/* Play Button - Original */
.play-btn {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  border: none;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 0 10px white;
  flex-shrink: 0;
}

/* Next/Prev Controls */
.controls {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 15px;
}
.controls button {
  background: rgba(255,255,255,0.1);
  border: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
}
.controls button:hover {
  background: rgba(178,102,255,0.3);
  transform: scale(1.1);
}

/* Playlist */
.playlist {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  padding: 8px;
  max-height: 260px;
  overflow-y: auto;
}
.playlist-item {
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
}
.playlist-item:hover, .playlist-item.active {
  background: rgba(178,102,255,0.15);
}
.playlist-item img {
  width: 36px;
  height: 36px;
  border-radius: 8px;
}
</style>
</head>

<body>

<!-- LOADER + BACKGROUND (same) -->
<div id="loader">
  <div class="loader-content">
    <h1>NSFW a head</h1>
    <p>click to continue</p>
  </div>
</div>

<div class="nebula"></div>
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>
<div class="layer"></div>

<div class="container" id="container">

  <div class="profile">
    <img src="https://i.imgur.com/8Km9tLL.jpg" id="profileImg">
    <div>
      <div class="glow-text" id="glowText">2017</div>
      <div style="opacity:.6;">nothing to write</div>
    </div>
  </div>

  <div class="card" id="card">
    <img src="/VideoToGif_GIF.gif">
  </div>

  <!-- Original Player Style -->
  <div class="player" id="player">
    <img src="https://i.imgur.com/YQ9Z1Zm.png" id="albumArt">
    <div class="player-info">
      <div class="song-title" id="songTitle">no need 4 love</div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <input type="range" class="progress-range" id="progress" min="0" max="100" value="0" step="0.1">
      </div>

      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <button class="play-btn" id="playBtn" onclick="playPause()">
      <svg id="iconPlay" width="13" height="15" viewBox="0 0 13 15" fill="black" style="margin-left:2px;">
        <polygon points="0,0 13,7.5 0,15"/>
      </svg>
      <svg id="iconPause" width="11" height="13" viewBox="0 0 11 13" fill="black" style="display:none;">
        <rect x="0" y="0" width="3.5" height="13" rx="1"/>
        <rect x="7.5" y="0" width="3.5" height="13" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- Next / Previous -->
  <div class="controls">
    <button onclick="prevSong()">⫻</button>
    <button onclick="nextSong()">⫻</button>
  </div>

  <!-- Playlist -->
  <div class="playlist" id="playlist"></div>

  <audio id="audio" crossorigin="anonymous"></audio>
</div>

<script>
/* === All your previous working code + playlist === */
const loader = document.getElementById("loader");
const audio = document.getElementById("audio");
const songTitle = document.getElementById("songTitle");
const albumArt = document.getElementById("albumArt");
const progress = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const currentTimeEl = document.getElementById("currentTime");
const totalTimeEl = document.getElementById("totalTime");
const playBtn = document.getElementById("playBtn");
const iconPlay = document.getElementById("iconPlay");
const iconPause = document.getElementById("iconPause");
const playlistEl = document.getElementById("playlist");

const profileImg = document.getElementById("profileImg");
const glowText = document.getElementById("glowText");
const card = document.getElementById("card");
const playerEl = document.getElementById("player");

const playlist = [
  { title: "no need 4 love", src: "/v14044g50000d5ef7vvog65ln2cr2vi0.mp3", cover: "https://picsum.photos/id/1015/300/300" },
  { title: "eternal glow", src: "/v14044g50000d5ef7vvog65ln2cr2vi0.mp3", cover: "https://picsum.photos/id/1015/300/300" },
  { title: "midnight drift", src: "https://cdn.pixabay.com/audio/2024/05/20/audio_5e5c0f8e2a.mp3", cover: "https://picsum.photos/id/201/300/300" }
];

let currentIndex = 0;
let isPlaying = false;
let audioCtx, analyser, source, dataArray;
let audioReady = false;
let visualIntensity = 0;

function renderPlaylist() {
  playlistEl.innerHTML = "";
  playlist.forEach((song, i) => {
    const item = document.createElement("div");
    item.className = `playlist-item ${i === currentIndex ? 'active' : ''}`;
    item.innerHTML = `<img src="${song.cover}"><div class="song-title">${song.title}</div>`;
    item.onclick = () => playSong(i);
    playlistEl.appendChild(item);
  });
}

function loadSong(index) {
  currentIndex = index;
  const song = playlist[index];
  audio.src = song.src;
  songTitle.textContent = song.title;
  albumArt.src = song.cover;
  renderPlaylist();
}

function playSong(index) {
  loadSong(index);
  audio.play().catch(()=>{});
  isPlaying = true;
  setPlayingUI(true);
}

function nextSong() {
  let next = currentIndex + 1;
  if (next >= playlist.length) next = 0;
  playSong(next);
}

function prevSong() {
  let prev = currentIndex - 1;
  if (prev < 0) prev = playlist.length - 1;
  playSong(prev);
}

function playPause() {
  if (audio.paused) {
    setupAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    audio.play();
    isPlaying = true;
  } else {
    audio.pause();
    isPlaying = false;
  }
  setPlayingUI(isPlaying);
}

function setPlayingUI(playing) {
  iconPlay.style.display = playing ? "none" : "block";
  iconPause.style.display = playing ? "block" : "none";
}

// Time & Progress
audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + "%";
  progress.value = pct;
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener("loadedmetadata", () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

progress.addEventListener("input", () => {
  if (!audio.duration) return;
  audio.currentTime = (progress.value / 100) * audio.duration;
});

audio.addEventListener("ended", nextSong);

function formatTime(secs) {
  if (isNaN(secs)) return "0:00";
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Visualizer (same as before)
function setupAudio() {
  if (audioReady) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.75;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  audioReady = true;
}

function beatLoop() {
  requestAnimationFrame(beatLoop);
  const target = isPlaying ? 1 : 0;
  visualIntensity += (target - visualIntensity) * 0.12;

  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);

  let bass = 0; for (let i = 0; i < 10; i++) bass += dataArray[i]; bass = bass / 10 / 255;
  let mid = 0; for (let i = 10; i < 60; i++) mid += dataArray[i]; mid = mid / 50 / 255;
  let vol = 0; for (let i = 0; i < dataArray.length; i++) vol += dataArray[i]; vol = vol / dataArray.length / 255;

  const intensity = visualIntensity;

  profileImg.style.boxShadow = `0 0 ${10 + bass * 60 * intensity}px #b266ff, 0 0 ${20 + bass * 90 * intensity}px #b266ff`;
  glowText.style.textShadow = `0 0 10px #fff, 0 0 ${20 + mid * 40 * intensity}px #b266ff, 0 0 ${40 + mid * 40 * intensity}px #b266ff`;
  card.style.boxShadow = `0 0 ${20 + bass * 60 * intensity}px rgba(178,102,255,${0.3 + bass * 0.6 * intensity})`;
  playerEl.style.boxShadow = `0 0 ${15 + vol * 50 * intensity}px rgba(255,255,255,${0.15 + vol * 0.4 * intensity})`;
  
  const scale = 1 + bass * 0.04 * intensity;
  albumArt.style.transform = `scale(${scale})`;
  albumArt.style.boxShadow = `0 0 ${bass * 60 * intensity}px rgba(178,102,255,${bass * 0.8 * intensity})`;
  
  playBtn.style.boxShadow = `0 0 ${10 + bass * 60 * intensity}px rgba(255,255,255,${0.6 + bass * 0.4 * intensity})`;
}

// Loader
loader.addEventListener("click", async () => {
  loader.style.opacity = "0";
  setTimeout(() => loader.style.display = "none", 800);
  setupAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  await audio.play().catch(()=>{});
  isPlaying = true;
  setPlayingUI(true);
});

// Parallax
document.addEventListener("mousemove", e => {
  const x = (e.clientX / window.innerWidth - 0.5) * 10;
  const y = (e.clientY / window.innerHeight - 0.5) * 10;
  document.getElementById("container").style.transform = `translate(${x}px, ${y}px)`;
});

// Init
renderPlaylist();
loadSong(0);
beatLoop();
</script>
</body>
</html>
